services:
  producao:
    build: .
    env_file: .env.producao
    volumes:
      - producao-db:/app/data
    restart: unless-stopped

  homologacao:
    build: .
    env_file: .env.homologacao
    volumes:
      - homologacao-db:/app/data
    restart: unless-stopped

  backup-producao:
    build: .
    env_file: .env.producao
    volumes:
      - producao-db:/app/data
    command: sh -c "while true; do node dist/scripts/backup.js; sleep 86400; done"
    restart: unless-stopped

  backup-homologacao:
    build: .
    env_file: .env.homologacao
    volumes:
      - homologacao-db:/app/data
    command: sh -c "while true; do node dist/scripts/backup.js; sleep 86400; done"
    restart: unless-stopped

volumes:
  producao-db:
  homologacao-db:
