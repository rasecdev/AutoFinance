  # Fase 9 (WhatsApp via WAHA, Rodada 1) — único par de serviços do projeto
  # sem `build:` próprio: é imagem publicada pela WAHA, não código deste
  # repositório. Porta local (não publicada pra fora da VM) só pra permitir
  # curl/QR code manual durante pareamento (scripts/parearWhatsapp.ts) e
  # verificação de health — não é o servidor HTTP público que a Rodada 1
  # dispensa (ver tasks/plan.md). Tag `noweb-arm`, não `latest`/`noweb`: a VM
  # (Oracle Ampere A1) é ARM64, e `devlikeapro/waha` só publica manifesto
  # arm64 nas tags com sufixo `-arm` — achado real ao rodar `docker compose
  # up -d` na VM (`latest` deu "no matching manifest for linux/arm64/v8").
  # A WAHA espera a chave de API na variável `WAHA_API_KEY` (nome dela,
  # diferente de `WHATSAPP_WAHA_API_KEY` que o app usa pra se autenticar
  # contra ela) — mesmo valor nos dois lados. Em vez de `env_file` pro mesmo
  # arquivo do app (exporia TELEGRAM_BOT_TOKEN/DATABASE_ENCRYPTION_KEY/etc.
  # sem necessidade a um container de terceiro), a interpolação `${...}` lê
  # de um `.env` próprio na raiz (gitignored, só essas 2 chaves) — só isso
  # fica visível pro container da WAHA.
  whatsapp-homologacao:
    image: devlikeapro/waha:noweb-arm
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY_HOMOLOGACAO}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - whatsapp-homologacao-sessoes:/app/.sessions
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  whatsapp-producao:
    image: devlikeapro/waha:noweb-arm
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY_PRODUCAO}
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - whatsapp-producao-sessoes:/app/.sessions
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  producao-db:
  homologacao-db:
  whatsapp-homologacao-sessoes:
  whatsapp-producao-sessoes:
