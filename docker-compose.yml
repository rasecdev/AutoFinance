  backup-producao:
    build: .
    image: autofinance:latest
    env_file: .env.producao
    volumes:
      - producao-db:/app/data
    command: sh -c "while true; do node dist/scripts/backup.js; sleep 86400; done"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

