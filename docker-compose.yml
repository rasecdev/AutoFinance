services:
  producao:
    build: .
    image: autofinance:latest
    env_file: .env.producao
    volumes:
      - producao-db:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  homologacao:
    build: .
    image: autofinance:latest
    env_file: .env.homologacao
    volumes:
      - homologacao-db:/app/data
