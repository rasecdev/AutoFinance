<svg viewBox="0 0 560 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="procCard"><rect width="560" height="900" rx="16"/></clipPath>
    <marker id="arrowProc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <g clip-path="url(#procCard)">
    <rect width="560" height="900" fill="#eef1f5"/>
    <rect width="560" height="36" fill="#2f6fed"/>
    <text x="20" y="23" fill="#ffffff" font-size="13" font-weight="700">AutoFinance &#183; processes</text>

    <!-- ============ Bot card ============ -->
    <rect x="40" y="60" width="480" height="180" rx="14" fill="#ffffff" stroke="#dde2e8"/>
    <text x="60" y="90" font-size="13" fill="#1c2430" font-weight="700">Main bot</text>
    <text x="60" y="108" font-size="10" fill="#4a5568" font-weight="700">single process</text>
    <text x="60" y="132" font-size="10.5" fill="#1c2430" font-weight="700">Router / Telegram webhook</text>
    <text x="60" y="152" font-size="10.5" fill="#1c2430" font-weight="700">conversa_texto / handlerMidia</text>
    <text x="60" y="172" font-size="10.5" fill="#1c2430" font-weight="700">In-memory confirmation (Map)</text>

    <!-- arrows bot <-> db -->
    <line x1="260" y1="250" x2="260" y2="310" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrowProc)"/>
    <line x1="300" y1="310" x2="300" y2="250" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrowProc)"/>
    <text x="222" y="284" font-size="9" fill="#5b6472" text-anchor="end" font-weight="700">write/read</text>
    <text x="338" y="284" font-size="9" fill="#5b6472" text-anchor="start" font-weight="700">confirm</text>

    <!-- ============ Shared SQLite: chip with legs ============ -->
    <rect x="195" y="310" width="6" height="10" fill="#1c2430"/>
    <rect x="277" y="310" width="6" height="10" fill="#1c2430"/>
    <rect x="359" y="310" width="6" height="10" fill="#1c2430"/>
    <rect x="195" y="490" width="6" height="10" fill="#1c2430"/>
    <rect x="277" y="490" width="6" height="10" fill="#1c2430"/>
    <rect x="359" y="490" width="6" height="10" fill="#1c2430"/>
    <rect x="128" y="368" width="12" height="6" fill="#1c2430"/>
    <rect x="128" y="436" width="12" height="6" fill="#1c2430"/>
    <rect x="420" y="368" width="12" height="6" fill="#1c2430"/>
    <rect x="420" y="436" width="12" height="6" fill="#1c2430"/>
    <rect x="140" y="320" width="280" height="170" rx="16" fill="#1c2430"/>
    <text x="280" y="396" font-size="14" fill="#8fe3c0" text-anchor="middle" font-weight="700">Shared SQLite</text>
    <text x="280" y="416" font-size="11" fill="#c7cfda" text-anchor="middle" font-weight="700">single file &#183; SQLCipher</text>
    <text x="280" y="434" font-size="9.5" fill="#c7cfda" text-anchor="middle" font-weight="700">confirmacoes_pendentes &#183; mensagens_pendentes_apagar</text>
    <text x="280" y="450" font-size="9.5" fill="#c7cfda" text-anchor="middle" font-weight="700">emails_processados</text>

    <!-- arrows db <-> jobs -->
    <line x1="260" y1="560" x2="260" y2="500" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrowProc)"/>
    <line x1="300" y1="500" x2="300" y2="560" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrowProc)"/>
    <text x="222" y="534" font-size="9" fill="#5b6472" text-anchor="end" font-weight="700">write</text>
    <text x="338" y="534" font-size="9" fill="#5b6472" text-anchor="start" font-weight="700">read pending</text>

    <!-- ============ Jobs card ============ -->
    <rect x="40" y="560" width="480" height="250" rx="14" fill="#ffffff" stroke="#dde2e8"/>
    <text x="60" y="590" font-size="13" fill="#1c2430" font-weight="700">Scheduled jobs</text>
    <text x="60" y="608" font-size="10" fill="#4a5568" font-weight="700">separate processes (cron)</text>
    <text x="60" y="632" font-size="10.5" fill="#1c2430" font-weight="700">lerEmailFaturas</text>
    <text x="60" y="652" font-size="10.5" fill="#1c2430" font-weight="700">sincronizarCalendario</text>
    <text x="60" y="672" font-size="10.5" fill="#1c2430" font-weight="700">relatorioMensal</text>
    <text x="60" y="692" font-size="10.5" fill="#1c2430" font-weight="700">verificarDespesasFixas &#183; monitorarPrecos</text>
    <text x="60" y="712" font-size="10" fill="#94a1b3" font-weight="700">Phase 8: Pluggy sync (planned)</text>

    <!-- ============ callout: real finding ============ -->
    <rect x="60" y="826" width="440" height="56" rx="10" fill="#fff6ec" stroke="#e3a45c" stroke-dasharray="5,4"/>
    <text x="280" y="846" font-size="10" fill="#7a4b06" text-anchor="middle" font-weight="700">Real finding (2026-09-17):</text>
    <text x="280" y="862" font-size="9.5" fill="#7a4b06" text-anchor="middle" font-weight="700">in-memory confirmation doesn't cross processes &#8212;</text>
    <text x="280" y="876" font-size="9.5" fill="#7a4b06" text-anchor="middle" font-weight="700">moved into SQLite.</text>
  </g>
</svg>
