<svg viewBox="0 0 960 350" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="infraCardWide"><rect width="960" height="350" rx="16"/></clipPath>
    <marker id="arrowWide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <g clip-path="url(#infraCardWide)">
