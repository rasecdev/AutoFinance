    <rect x="36" y="132" width="206" height="46" rx="10" fill="#dff3e1"/>
    <text x="46" y="150" font-size="10.5" fill="#173d1e" font-weight="700">I spent $45 at the store,</text>
    <text x="46" y="166" font-size="10.5" fill="#173d1e" font-weight="700">Checking account, Visa Infinity</text>
    <rect x="36" y="190" width="206" height="76" rx="10" fill="#ffffff" stroke="#dde2e8"/>
    <text x="46" y="208" font-size="10.5" fill="#1c2430" font-weight="700">Logged: Grocery store</text>
    <text x="46" y="224" font-size="10.5" fill="#4a5568" font-weight="700">$45.00 - Groceries</text>
    <text x="46" y="240" font-size="10.5" fill="#4a5568" font-weight="700">Checking account - Visa Infinity</text>
    <text x="139" y="306" font-size="10.5" fill="#4a5568" text-anchor="middle" font-weight="700">User (Telegram)</text>

