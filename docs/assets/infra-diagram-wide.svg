    <!-- ============ TELEGRAM: mini snapshot of the real chat ============ -->
    <rect x="24" y="90" width="230" height="200" rx="14" fill="#ffffff" stroke="#dde2e8"/>
    <clipPath id="tgHeaderClipWide"><rect x="24" y="90" width="230" height="200" rx="14"/></clipPath>
    <g clip-path="url(#tgHeaderClipWide)">
      <rect x="24" y="90" width="230" height="30" fill="#2f6fed"/>
      <circle cx="44" cy="105" r="9" fill="#ffffff" opacity="0.22"/>
      <text x="44" y="109" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">A</text>
      <text x="60" y="109" fill="#ffffff" font-size="11" font-weight="700">AutoFinance</text>
      <circle cx="238" cy="105" r="3.5" fill="#7CFFB2"/>
