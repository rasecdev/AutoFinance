    <text x="299" y="189" font-size="10" fill="#5b6472" text-anchor="middle" font-weight="700">response</text>

    <!-- ============ VM: computer (monitor + stand) ============ -->
    <rect x="344" y="70" width="280" height="190" rx="10" fill="#1c2430"/>
    <rect x="356" y="82" width="256" height="150" rx="4" fill="#ffffff"/>
    <text x="372" y="102" font-size="9.5" fill="#9aa4b2" font-weight="700">docker compose:</text>
    <text x="372" y="120" font-size="10.5" fill="#1c2430" font-weight="700">development &#8594; Staging</text>
    <text x="372" y="134" font-size="9.5" fill="#4a5568" font-weight="700">bot + SQLite</text>
    <text x="372" y="156" font-size="10.5" fill="#1c2430" font-weight="700">master &#8594; Production</text>
    <text x="372" y="170" font-size="9.5" fill="#4a5568" font-weight="700">bot + SQLite</text>
    <text x="484" y="214" font-size="11" fill="#7a8493" text-anchor="middle" font-weight="700">promotion: always manual</text>

