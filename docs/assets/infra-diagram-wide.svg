    <rect x="434" y="285" width="100" height="10" rx="4" fill="#1c2430"/>

    <text x="484" y="318" font-size="10.5" fill="#4a5568" text-anchor="middle" font-weight="700">VM Oracle Cloud &#8212; Always Free</text>

    <!-- arrows VM <-> OpenRouter -->
    <line x1="624" y1="155" x2="714" y2="155" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrowWide)"/>
    <line x1="714" y1="175" x2="624" y2="175" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrowWide)"/>
    <text x="669" y="145" font-size="10" fill="#5b6472" text-anchor="middle" font-weight="700">call</text>
    <text x="669" y="189" font-size="10" fill="#5b6472" text-anchor="middle" font-weight="700">response</text>

    <!-- ============ OpenRouter: AI chip, text inside ============ -->
    <rect x="759" y="90" width="6" height="10" fill="#1c2430"/>
    <rect x="806" y="90" width="6" height="10" fill="#1c2430"/>
    <rect x="853" y="90" width="6" height="10" fill="#1c2430"/>
    <rect x="759" y="230" width="6" height="10" fill="#1c2430"/>
    <rect x="806" y="230" width="6" height="10" fill="#1c2430"/>
    <rect x="853" y="230" width="6" height="10" fill="#1c2430"/>
    <rect x="712" y="130" width="12" height="6" fill="#1c2430"/>
    <rect x="712" y="180" width="12" height="6" fill="#1c2430"/>
    <rect x="894" y="130" width="12" height="6" fill="#1c2430"/>
    <rect x="894" y="180" width="12" height="6" fill="#1c2430"/>
    <rect x="724" y="100" width="170" height="130" rx="16" fill="#1c2430"/>
    <text x="809" y="155" font-size="14" fill="#8fe3c0" text-anchor="middle" font-weight="700">OpenRouter</text>
    <text x="809" y="177" font-size="11" fill="#c7cfda" text-anchor="middle" font-weight="700">AI routed</text>
    <text x="809" y="193" font-size="11" fill="#c7cfda" text-anchor="middle" font-weight="700">by flow</text>
