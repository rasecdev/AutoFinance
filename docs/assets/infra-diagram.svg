<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="infraCard"><rect width="960" height="380" rx="16"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <g clip-path="url(#infraCard)">
    <rect width="960" height="380" fill="#eef1f5"/>
    <rect width="960" height="36" fill="#2f6fed"/>
    <text x="20" y="23" fill="#ffffff" font-size="13" font-weight="700">AutoFinance &#183; infraestrutura</text>

    <!-- ============ TELEGRAM: mini print do chat real ============ -->
    <rect x="30" y="90" width="230" height="200" rx="14" fill="#ffffff" stroke="#dde2e8"/>
    <clipPath id="tgHeaderClip"><rect x="30" y="90" width="230" height="200" rx="14"/></clipPath>
    <g clip-path="url(#tgHeaderClip)">
      <rect x="30" y="90" width="230" height="30" fill="#2f6fed"/>
      <circle cx="50" cy="105" r="9" fill="#ffffff" opacity="0.22"/>
      <text x="50" y="109" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">A</text>
      <text x="66" y="109" fill="#ffffff" font-size="11" font-weight="700">AutoFinance</text>
      <circle cx="244" cy="105" r="3.5" fill="#7CFFB2"/>
    </g>
    <rect x="42" y="132" width="206" height="46" rx="10" fill="#dff3e1"/>
    <text x="52" y="150" font-size="10.5" fill="#173d1e" font-weight="700">Gastei 45 no mercado na conta</text>
    <text x="52" y="166" font-size="10.5" fill="#173d1e" font-weight="700">Corrente, Visa Infinity</text>
    <rect x="42" y="190" width="206" height="76" rx="10" fill="#ffffff" stroke="#dde2e8"/>
    <text x="52" y="208" font-size="10.5" fill="#1c2430" font-weight="700">Registrado: Mercado</text>
    <text x="52" y="224" font-size="10.5" fill="#4a5568" font-weight="700">R$ 45,00 - Alimentacao</text>
    <text x="52" y="240" font-size="10.5" fill="#4a5568" font-weight="700">Conta Corrente - Visa Infinity</text>
    <text x="145" y="306" font-size="10.5" fill="#4a5568" text-anchor="middle" font-weight="700">Usuario (Telegram)</text>

    <!-- arrows telegram <-> VM -->
    <line x1="260" y1="182" x2="330" y2="182" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="330" y1="200" x2="260" y2="200" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="295" y="172" font-size="10" fill="#5b6472" text-anchor="middle" font-weight="700">mensagens</text>
    <text x="295" y="214" font-size="10" fill="#5b6472" text-anchor="middle" font-weight="700">resposta</text>

    <!-- ============ VM: computador com monitor, teclado e mouse ============ -->
    <rect x="340" y="60" width="280" height="190" rx="10" fill="#1c2430"/>
    <rect x="352" y="72" width="256" height="150" rx="4" fill="#ffffff"/>
    <text x="368" y="92" font-size="9.5" fill="#9aa4b2" font-weight="700">docker compose:</text>
    <text x="368" y="110" font-size="10.5" fill="#1c2430" font-weight="700">development &#8594; Homologacao</text>
    <text x="368" y="124" font-size="9.5" fill="#4a5568" font-weight="700">bot + SQLite</text>
    <text x="368" y="146" font-size="10.5" fill="#1c2430" font-weight="700">master &#8594; Producao</text>
    <text x="368" y="160" font-size="9.5" fill="#4a5568" font-weight="700">bot + SQLite</text>
    <text x="480" y="202" font-size="9" fill="#9aa4b2" text-anchor="middle" font-weight="700">promocao: sempre manual</text>

    <!-- stand -->
    <rect x="465" y="250" width="30" height="25" fill="#1c2430"/>
    <rect x="430" y="275" width="100" height="10" rx="4" fill="#1c2430"/>

    <!-- keyboard -->
    <rect x="400" y="300" width="160" height="34" rx="6" fill="#ffffff" stroke="#dde2e8"/>
    <rect x="408" y="306" width="14" height="6" rx="1.5" fill="#dde2e8"/>
    <rect x="424" y="306" width="14" height="6" rx="1.5" fill="#dde2e8"/>
    <rect x="440" y="306" width="14" height="6" rx="1.5" fill="#dde2e8"/>
    <rect x="456" y="306" width="14" height="6" rx="1.5" fill="#dde2e8"/>
    <rect x="472" y="306" width="14" height="6" rx="1.5" fill="#dde2e8"/>
    <rect x="488" y="306" width="14" height="6" rx="1.5" fill="#dde2e8"/>
    <rect x="504" y="306" width="14" height="6" rx="1.5" fill="#dde2e8"/>
    <rect x="520" y="306" width="14" height="6" rx="1.5" fill="#dde2e8"/>
    <rect x="440" y="318" width="80" height="8" rx="2" fill="#dde2e8"/>

    <!-- mouse -->
    <rect x="578" y="296" width="26" height="40" rx="13" fill="#ffffff" stroke="#dde2e8"/>
    <line x1="591" y1="296" x2="591" y2="316" stroke="#dde2e8" stroke-width="1.3"/>
    <circle cx="591" cy="306" r="2" fill="#9aa4b2"/>

    <text x="480" y="350" font-size="10.5" fill="#4a5568" text-anchor="middle" font-weight="700">VM Oracle Cloud &#8212; Always Free</text>

    <!-- arrows VM <-> OpenRouter -->
    <line x1="620" y1="182" x2="740" y2="182" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="740" y1="198" x2="620" y2="198" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="680" y="172" font-size="10" fill="#5b6472" text-anchor="middle" font-weight="700">chamada</text>
    <text x="680" y="214" font-size="10" fill="#5b6472" text-anchor="middle" font-weight="700">resposta</text>

    <!-- ============ OpenRouter: chip de IA, texto dentro ============ -->
    <rect x="775" y="90" width="6" height="10" fill="#1c2430"/>
    <rect x="822" y="90" width="6" height="10" fill="#1c2430"/>
    <rect x="869" y="90" width="6" height="10" fill="#1c2430"/>
    <rect x="775" y="230" width="6" height="10" fill="#1c2430"/>
    <rect x="822" y="230" width="6" height="10" fill="#1c2430"/>
    <rect x="869" y="230" width="6" height="10" fill="#1c2430"/>
    <rect x="728" y="140" width="12" height="6" fill="#1c2430"/>
    <rect x="728" y="190" width="12" height="6" fill="#1c2430"/>
    <rect x="908" y="140" width="12" height="6" fill="#1c2430"/>
    <rect x="908" y="190" width="12" height="6" fill="#1c2430"/>
    <rect x="740" y="100" width="170" height="130" rx="16" fill="#1c2430"/>
    <text x="825" y="155" font-size="14" fill="#8fe3c0" text-anchor="middle" font-weight="700">OpenRouter</text>
    <text x="825" y="177" font-size="11" fill="#c7cfda" text-anchor="middle" font-weight="700">IA roteada</text>
    <text x="825" y="193" font-size="11" fill="#c7cfda" text-anchor="middle" font-weight="700">por fluxo</text>
