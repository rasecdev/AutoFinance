name: CI

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has-package-json
        run: echo "exists=$(test -f package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has-package-json.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.has-package-json.outputs.exists == 'true'
        run: npm ci
      - if: steps.has-package-json.outputs.exists == 'true'
        run: npm run lint --if-present
      - if: steps.has-package-json.outputs.exists == 'true'
        run: npm test --if-present
      - if: steps.has-package-json.outputs.exists == 'true'
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has-dockerfile
        run: echo "exists=$(test -f Dockerfile && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has-dockerfile.outputs.exists == 'true'
        run: docker build .
      - if: steps.has-dockerfile.outputs.exists == 'true'
        name: Criar .env de teste só pra validar docker compose config (nunca comitados, gitignored)
        run: cp .env.example .env.producao && cp .env.example .env.homologacao
      - if: steps.has-dockerfile.outputs.exists == 'true'
        run: docker compose config

  deploy:
    needs: [gitleaks, node, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Definir ambiente
        id: ambiente
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "nome=producao" >> "$GITHUB_OUTPUT"
          else
            echo "nome=homologacao" >> "$GITHUB_OUTPUT"
          fi
      - name: Configurar acesso SSH à VM
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Disparar deploy na VM
        run: |
          # A chave SSH usada aqui é restrita (via `command=` no authorized_keys, usuário
          # dedicado sem sudo na VM) a rodar só /opt/autofinance-deploy/deploy.sh — o texto
          # abaixo vira só o $SSH_ORIGINAL_COMMAND lido por esse script, não um comando livre.
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "${{ steps.ambiente.outputs.nome }}"
